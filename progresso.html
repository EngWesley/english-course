<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>English Course — Progresso</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWix+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkR4j8wQ+8hB8nFfA9V0H9N7M0P0iP6LJ2Ew==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="progresso">
  <header class="topbar">
    <div class="container topbar-inner">
      <a class="logo" href="index.html">🇺🇸 English Course</a>
      <nav class="menu">
        <a href="index.html">Dashboard</a>
        <a href="hoje.html">Aula de Hoje</a>
        <a href="plano.html">Plano</a>
        <a class="active" href="progresso.html">Progresso</a>
        <a href="recursos.html">Recursos</a>
      </nav>
    </div>
  </header>

  <main class="container page">
    <section class="card">
      <div class="space-between">
        <div>
          <h1>Tracker de progresso</h1>
          <p class="muted">Consistência diária no estilo do GitHub.</p>
        </div>
        <button id="resetCourse" class="btn danger" type="button"><i class="fas fa-rotate-left"></i> Reiniciar Curso</button>
      </div>
      <div id="contribGrid" class="contrib-grid"></div>
    </section>

    <section class="grid two-col">
      <article class="card">
        <h2>Habilidades</h2>
        <div id="skillsBars" class="skills-bars"></div>
      </article>

      <article class="card">
        <h2>Vocabulário</h2>
        <p>Total acumulado: <strong id="wordsTotal">0</strong> palavras</p>
        <form id="wordsForm" class="inline-form">
          <label for="wordsInput">Palavras aprendidas hoje:</label>
          <input id="wordsInput" type="number" min="0" step="1" placeholder="Ex: 20" required />
          <button class="btn btn-primary" type="submit">Adicionar</button>
        </form>
      </article>
    </section>

    <section class="card">
      <h2>Últimos 7 dias</h2>
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Dia</th>
              <th>Status</th>
              <th>Atividades</th>
            </tr>
          </thead>
          <tbody id="last7Table"></tbody>
        </table>
      </div>
    </section>
  </main>

  <div id="toastContainer" class="toast-container"></div>
  <script src="app.js"></script>
</body>
</html>
